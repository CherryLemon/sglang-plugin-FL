# SGLang-FL Dispatch Configuration for MUSA (Moore Threads) platform
prefer: flagos

# Launch profiles for upstream SGLang/TorchAda kernels. Hardware, dtype and
# model-shape guards remain in the vendor bridge. SGLANG_FL_CONFIG replaces
# this section as well; omitted profiles retain the upstream schedule.
# FlagGems-sglang kernel defaults live in its _mthreads/tune_configs.yaml.
kernel_tuning:
  fused_moe:
    r2_m4_baseline: {BLOCK_SIZE_M: 16, BLOCK_SIZE_N: 32, BLOCK_SIZE_K: 64, GROUP_SIZE_M: 1}
    decode: {BLOCK_SIZE_M: 32, BLOCK_SIZE_N: 32, BLOCK_SIZE_K: 64, GROUP_SIZE_M: 1, num_warps: 4, num_stages: 1}
    prefill: {BLOCK_SIZE_M: 32, BLOCK_SIZE_N: 128, BLOCK_SIZE_K: 64, GROUP_SIZE_M: 4, num_warps: 8, num_stages: 1}
    prefill_m16k: {BLOCK_SIZE_M: 64, BLOCK_SIZE_N: 128, BLOCK_SIZE_K: 64, GROUP_SIZE_M: 4, num_warps: 8, num_stages: 1}
  topk:
    qwen36: {num_warps: 1, num_ctas: 1, num_stages: 1}

# FlagGems tag:    v5.3.0
# FlagGems commit: 98fae44cdf2898f39c7f24f080d7c88b83d7c593
flagos_blacklist:
  - count_nonzero
  - cumsum
  - mm
  - unique
  - _unique2
  - unique_dim
  - unique_consecutive
  # On MTT S5000, FlagGems' rank-specialized pointwise copy kernels dominate
  # long-prefill traces.  The native MUSA path is faster after its one-time
  # shape specialization and also improves the graph-captured decode path.
  - copy_
  # Retain the campaign's native gather/multiply choices without requiring
  # a launch-time blacklist override that replaces this entire YAML list.
  - index
  - mul
  # FlagGems' generated index-put kernel is especially slow for the large
  # prefill KV-cache writes used by Qwen3.6 on S5000.  Keep all three ATen
  # entry points on the native MUSA implementation so indexing syntax,
  # index_put_(), and the internal unsafe overload follow one policy.
  - index_put
  - index_put_
  - _index_put_impl_
